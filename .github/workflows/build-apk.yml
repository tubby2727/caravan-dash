name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "app/**"
      - "index.html"
      - ".github/workflows/build-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Generate the Android project
        working-directory: app
        run: |
          npm install
          mkdir -p www
          cp ../index.html www/index.html
          npx cap add android
          python3 scripts/apply_native.py
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: caravan-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the Releases page (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest app/android/app/build/outputs/apk/debug/app-debug.apk \
            --title "Caravan APK (latest build)" \
            --notes "Debug build of commit ${{ github.sha }}. Download app-debug.apk on the phone and install it."
